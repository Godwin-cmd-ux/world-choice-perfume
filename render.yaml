services:
  - type: web
    name: world-choice-perfumes
    runtime: docker
    dockerfilePath: Dockerfile
    env: docker
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
    buildCommand: "--build-arg BUILD_TIME=$(date +%s)"
    startCommand: "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
    healthCheckPath: /
    disk:
      mountPath: /var/www/html/storage
      sizeGB: 1
